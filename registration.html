<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <header>


        <h1>Student Registration</h1>
        <form>
            <label>Full Name:</label>
            <input type="text" placeholder="Enter your Full Name" required><br><br>
            <label>Email:</label>
            <input type="email" placeholder="Enter your email" required><br><br>
            <label>Mobile No:</label>
            <input type="tel" pattern="{0-9}[10]" placeholder="Enter your mobile number" required><br><br>
            <label>Date of Birth</label>
            <input type="date" placeholder="Enter Your Date of Birth" required><br><br>
            <label>Course</label>
            <select>
                <option value="select_disabled">Select Course</option>
                <option value="CSE">CSE</option>
                <option value="BBA">BBA</option>
                <option value="AIMl">AIML</option>
                <option value="MBA">MBA</option>
            </select><br><br>
            <label>Password</label>
            <input type="password" placeholder="Enter your Password"><br><br>
            <label>Conform Password</label>
            <input type="password" placeholder="Conform your password"><br><br>
            <input type="submit" value="Register">
            <p>Already have Account?<a href="index.html"> Login </a></p>

        </form>
    </header>

</body>

</html>
